# Test configuration for the Postfach integration suite (dovecot/dovecot:2.3 image).
mail_home=/srv/mail/%Lu
mail_location=sdbox:~/Mail
mail_uid=1000
mail_gid=1000
first_valid_uid = 1000
last_valid_uid = 1000

protocols = imap

passdb {
  driver = static
  args = password=pass
}

ssl=yes
ssl_cert=</etc/dovecot/cert.pem
ssl_key=</etc/dovecot/key.pem

mail_plugins = $mail_plugins
imap_capability = +SPECIAL-USE

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox "Gesendete Objekte" {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Archiv {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Papierkorb {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Spam {
    special_use = \Junk
    auto = subscribe
  }
}

listen = *
log_path=/dev/stdout
info_log_path=/dev/stdout
