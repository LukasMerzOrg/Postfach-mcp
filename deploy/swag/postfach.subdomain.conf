## Version 2026/10/17
# Postfach MCP server behind SWAG.
# - The container must be named "postfach" and be on the same custom Docker network as SWAG.
# - Add "postfach" to SWAG's SUBDOMAINS (or use a wildcard certificate) and point DNS at your server.
# - Copy to /config/nginx/proxy-confs/postfach.subdomain.conf and restart SWAG.
#
# Do NOT enable Authelia/Authentik/basic auth here: Postfach is its own OAuth server, and claude.ai's backend must
# reach /mcp, /oauth/* and /.well-known/* without an interactive login in front.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name postfach.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 1m;

    # Not needed publicly; keep the probes LAN-only.
    location ~ ^/(healthz|readyz)$ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app postfach;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # MCP Streamable HTTP: responses can be server-sent events, so no buffering and generous timeouts.
    location /mcp {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app postfach;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;
    }

    # OAuth endpoints, consent pages and discovery metadata.
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app postfach;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
